<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page introuvable — Baye Aly Elhadj</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#070B12" />
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<script>
  (function () {
    try {
      var stored = localStorage.getItem("ba-theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) { /* ignore */ }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #070a10;
    --surface: #0e141f;
    --border: rgba(255, 255, 255, 0.09);
    --text: #eff4fa;
    --muted: #8e9dae;
    --accent: #f0bd83;
    --accent-2: #56cec0;
  }
  html[data-theme="light"] {
    --bg: #f7f3eb;
    --surface: #fffdf9;
    --border: rgba(20, 30, 45, 0.12);
    --text: #101821;
    --muted: #5a6878;
    --accent: #b5762c;
    --accent-2: #0f766e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
    background:
      radial-gradient(ellipse 60% 70% at 85% 5%, rgba(240, 189, 131, 0.16), transparent 60%),
      radial-gradient(ellipse 55% 65% at 5% 95%, rgba(86, 206, 192, 0.14), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: min(560px, 100%);
    padding: clamp(1.75rem, 5vw, 2.75rem);
    border-radius: 26px;
    border: 1px solid var(--border);
    background: var(--surface);
    box-shadow: 0 40px 80px -40px rgba(0, 0, 0, 0.65);
    text-align: center;
  }
  .code {
    font-family: "Outfit", "Segoe UI", sans-serif;
    font-size: clamp(4rem, 16vw, 6rem);
    font-weight: 700;
    line-height: 1;
    background: linear-gradient(100deg, #f6d3a6, #f0bd83 40%, #6fd7c9);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0 0 0.4rem;
  }
  h1 { font-family: "Outfit", "Segoe UI", sans-serif; font-size: 1.4rem; margin: 0 0 0.6rem; }
  p { color: var(--muted); font-size: 0.95rem; line-height: 1.65; margin: 0 0 1.6rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; }
  a {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.7rem 1.1rem;
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 500;
    text-decoration: none;
    transition: transform 0.25s ease, background-color 0.25s ease;
  }
  a:hover { transform: translateY(-2px); }
  .primary { background: linear-gradient(100deg, #f6d3a6, #f0bd83 55%, #e9b471); color: #171104; }
  .ghost { border: 1px solid var(--border); color: var(--text); }
  .ghost:hover { background: rgba(255, 255, 255, 0.05); }
  html[data-theme="light"] .ghost:hover { background: rgba(20, 30, 45, 0.05); }
  .brand { display: inline-block; font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.4rem; text-decoration: none; }
</style>
</head>
<body>
  <main>
    <a class="brand" href="/">Baye Aly Elhadj</a>
    <p class="code">404</p>
    <h1>Cette page n'existe pas</h1>
    <p>
      Le lien est peut-être obsolète, ou la page a été déplacée.
      Retrouvez le portfolio, les projets et le contact depuis l'accueil.
    </p>
    <div class="actions">
      <a class="primary" href="/">Retour à l'accueil</a>
      <a class="ghost" href="/#projets">Voir les projets</a>
      <a class="ghost" href="mailto:bayeelhadj@gmail.com">Me contacter</a>
    </div>
  </main>
</body>
</html>
